# Local-dev compose for a single-org @dna-codes/dna-api deployment.
#
# Usage (from the repo root):
#
#   docker compose -f packages/api/docker-compose.yml up
#
# The DNA file is mounted from the host at `./dna.json` relative to the
# compose file. Adjust `volumes:` to point at your domain's DNA.
#
# Production hardening (TLS, secrets management, observability) is OUT
# of scope — see packages/api/README.md.

services:
  neo4j:
    image: neo4j:5.24-community
    ports:
      - "7474:7474" # HTTP UI
      - "7687:7687" # Bolt
    environment:
      NEO4J_AUTH: "neo4j/devpassword"
      NEO4J_PLUGINS: '[]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      # Wait for Bolt to actually accept connections — the container starts
      # several seconds before the database is listening on 7687.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p devpassword 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  api:
    build:
      context: ../..
      dockerfile: packages/api/Dockerfile
    depends_on:
      neo4j:
        condition: service_healthy
    restart: on-failure
    ports:
      - "4000:4000"
    environment:
      DNA_FILE: /app/dna.json
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: devpassword
      PORT: "4000"
    volumes:
      - ./dna.json:/app/dna.json:ro

volumes:
  neo4j_data:
